name: Tests
# Run the full matrix for release tags, or on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  typst:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ["0.15.0", "0.15.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: ${{ matrix.version }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch Typst packages
        run: typst compile --root . scripts/fetch-packages.typ "$RUNNER_TEMP/fetch.pdf"
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/render-guide-examples.py --check
      - run: python scripts/render-guide-examples.py --verify --work-dir target/guide-examples-${{ matrix.version }}
      - run: python tests/docs.py
      - run: python scripts/render-readme.py --check
      - run: python tests/readme.py
      - run: python tests/page_numbering.py
      - run: python tests/run.py --manual
      - run: python tests/scene_avoidance.py
      - run: python tests/scene_ports.py
      - run: python tests/scene_sliding.py
      - run: python tests/route_group.py
      - run: python tests/route_group_ports.py
      - run: python tests/route_group_sockets.py
      - run: python tests/relay_repair.py
      - run: python tests/route_group_invariants.py
      - run: python tests/route_group_margin.py
      - run: python tests/route_group_index.py
