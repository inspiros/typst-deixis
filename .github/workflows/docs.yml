name: Docs
# Publish the mdBook site to GitHub Pages for release tags, or on demand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: typst-community/setup-typst@v4
        with:
          typst-version: "0.15.1"
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - name: Install mdBook 0.5.4
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - name: Fetch Typst packages
        run: typst compile --root . scripts/fetch-packages.typ "$RUNNER_TEMP/fetch.pdf"
      - run: python scripts/build-docs.py
        env:
          MDBOOK_OUTPUT__HTML__SITE_URL: /typst-deixis/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
